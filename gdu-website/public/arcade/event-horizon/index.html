<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Event Horizon</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Chakra Petch", system-ui, sans-serif; }
  #canvas { display: block; outline: none; visibility: hidden; background: #000; }
  #loading {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px;
    background: radial-gradient(circle at 50% 40%, #2a1608, #000 70%); color: #f7a823; text-align: center;
  }
  #loading p { margin: 0; font: 400 18px/1.3 "Bungee", Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  #loading small { font: 500 11px ui-monospace, Menlo, Consolas, monospace; color: #9b968a; letter-spacing: .08em; text-transform: uppercase; }
  #bar { width: 220px; height: 14px; padding: 2px; border: 2px solid #f7a823; }
  #bar span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #f7a823 0 10px, transparent 10px 13px); transition: width .15s steps(16); }
  #loading.error p { color: #ff4b4b; animation: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><p id="label">Loading</p><div id="bar"><span id="fill"></span></div><small id="detail">Event Horizon</small></div>
<script>
  var canvas = document.getElementById("canvas");
  var loading = document.getElementById("loading");
  var fill = document.getElementById("fill");
  var label = document.getElementById("label");
  var detail = document.getElementById("detail");

  // Games ask for desktop fullscreen at boot, and Emscripten replays that request on the first
  // click or key press. Inside the site's player that would take over the whole page, so swallow
  // it; the player's own Fullscreen button fullscreens the frame from the parent page instead.
  ["requestFullscreen", "webkitRequestFullscreen", "webkitRequestFullScreen", "mozRequestFullScreen", "msRequestFullscreen"].forEach(function (k) {
    if (Element.prototype[k]) Element.prototype[k] = function () { return Promise.resolve(); };
  });

  // Arrow keys / space must drive the game, not scroll the host page.
  window.addEventListener("keydown", function (e) {
    if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
  }, false);
  window.addEventListener("pointerdown", function () { window.focus(); canvas.focus(); });

  // Scale the canvas to fit the frame, keeping the game's own aspect ratio.
  function fit() {
    if (!canvas.width || !canvas.height) return;
    var s = Math.min(window.innerWidth / canvas.width, window.innerHeight / canvas.height);
    canvas.style.width = Math.floor(canvas.width * s) + "px";
    canvas.style.height = Math.floor(canvas.height * s) + "px";
  }
  window.addEventListener("resize", fit);

  function fail(msg) {
    loading.classList.add("error");
    loading.style.display = "grid";
    canvas.style.visibility = "hidden";
    label.textContent = "Could not start";
    detail.textContent = msg || "Check the browser console";
  }

  var Module = {
    arguments: ["./game.love"],
    INITIAL_MEMORY: 67108864,
    canvas: canvas,
    locateFile: function (p) { return p === "love.wasm" ? "../_runtime/love.wasm" : p; },
    printErr: console.error.bind(console),
    totalDependencies: 0,
    remainingDependencies: 0,
    monitorRunDependencies: function (left) {
      this.remainingDependencies = left;
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left === 0) {
        loading.style.display = "none";
        canvas.style.visibility = "visible";
        fit();
        canvas.focus();
      } else {
        fill.style.width = ((this.totalDependencies - left) / this.totalDependencies * 100) + "%";
      }
    },
    setStatus: function (text) {
      var m = /Downloading data\.\.\. \((\d+)\/(\d+)\)/.exec(text || "");
      if (m) {
        fill.style.width = (m[1] / m[2] * 100) + "%";
        label.textContent = "Downloading";
        detail.textContent = (m[1] / 1048576).toFixed(1) + " / " + (m[2] / 1048576).toFixed(1) + " MB";
      } else if (text) {
        label.textContent = text.replace(/\.\.\.$/, "");
      }
    },
    onAbort: function (what) { fail(String(what)); }
  };
  window.onerror = function () { fail(); };
  // The game may change the canvas size (love.window.setMode) after boot.
  new MutationObserver(fit).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
  var applicationLoad = function () { Love(Module); };
</script>
<script src="game.js"></script>
<script async src="../_runtime/love.js" onload="applicationLoad()"></script>
</body>
</html>
